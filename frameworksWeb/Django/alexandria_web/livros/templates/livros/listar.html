<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acervo de Livros</title>
</head>
<body>
    <h1>Acervo da Biblioteca</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Código</th>
                <th>Título</th>
                <th>Autor</th>
                <th>Quantidade</th>
            </tr>
        </thead>
        <tbody>
            {% for livro in livros %}
                <tr>
                    <td>{{ livro.codigo }}</td>
                    <td>{{ livro.titulo }}</td>
                    <td>{{ livro.autor }}</td>
                    <td>{{ livro.quantidade }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4">Nenhum livro cadastrado.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
