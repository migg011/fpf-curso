<!doctype html>
<html lang="pt-BR">
  <head>
    Formulario 1
  </head>
  <body>
    <h1>Login</h1>
    <p>Por favor, informe seu login</p>

    <!-- login e senha -->
    <form id="login" method="POST" action="/HTML/user/login">
      Login: <input type="text" name="nome" id="nome" /><br />
      Senha: <input type="password" name="senha" id="senha" />
      <input type="reset" value="Resetar Dados" />
      <input type="submit" name="submit" value="Entrar" /> <br />

      <!-- radio: bolinha para marcar -->
      <fieldset>
        <legend>Selecione seu Curso</legend>
        <input type="radio" name="curso" value="cc" checked />
        <label for="cc"> Ciencia da Computação </label><br />
        <input type="radio" name="curso" value="cc" checked />
        <label for="cc"> Engenharia de Softwares </label><br />
        <input type="radio" name="curso" value="cc" checked />
        <label for="cc"> Engenharia da Computação</label><br />

        <textarea cols="50" rows="20" name="description"></textarea>
      </fieldset>
    </form>
  </body>
</html>
